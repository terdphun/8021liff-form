<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3c72">
  <title>Project Visit Report</title>

  <!-- SweetAlert2 สำหรับป๊อปอัปแจ้งเตือน -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>
  <div class="container">
    <h2>รายงานการเข้าพบโครงการ</h2>
    
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="step-indicator" id="stepIndicator">ขั้นตอนที่ 1 จาก 4</div>

    <form id="visitForm" onsubmit="return false;">
      
      <!-- ขั้นตอนที่ 1: ข้อมูลหลัก -->
      <div class="form-section active" id="step1">
        <h3>1. ข้อมูลหลักโครงการ</h3>

        <label for="salesTeam">ทีมขาย *</label>
        <select id="salesTeam" required>
          <option value="">-- เลือกทีมขาย --</option>
          <option value="101">101</option>
          <option value="102">102</option>
          <option value="103">103</option>
          <option value="104">104</option>
          <option value="105">105</option>
          <option value="201">201</option>
          <option value="202">202</option>
          <option value="203">203</option>
          <option value="301">301</option>
          <option value="302">302</option>
          <option value="303">303</option>
          <option value="401">401</option>
          <option value="402">402</option>
          <option value="403">403</option>
          <option value="501">501</option>
          <option value="502">502</option>
          <option value="503">503</option>
          <option value="601">601</option>
          <option value="602">602</option>
          <option value="603">603</option>
          <option value="701">701</option>
          <option value="702">702</option>
          <option value="703">703</option>
          <option value="801">801</option>
          <option value="802">802</option>
          <option value="803">803</option>
        </select>

        <label for="saleCode">รหัสพนักงานขาย (Sale Code 6 หลัก) *</label>
        <input id="saleCode" type="text" placeholder="เช่น SAA001, MAA001" maxlength="6" required autocomplete="off" style="text-transform: uppercase;">
        
        <label for="developer">Developer *</label>
        <div class="input-wrapper">
          <input id="developer" type="text" placeholder="พิมพ์ค้นหา หรือ เลือก Developer..." required autocomplete="off">
          <div id="developerDropdown" class="custom-dropdown"></div>
        </div>
        
        <label for="project">โครงการ *</label>
        <div class="input-wrapper">
          <input id="project" type="text" placeholder="รอเลือก Developer..." required disabled autocomplete="off">
          <div id="projectDropdown" class="custom-dropdown"></div>
        </div>
        
        <label for="contact">ผู้ติดต่อ (เจ้าหน้าที่โครงการ)</label>
        <input id="contact" type="text" placeholder="กรอกชื่อผู้ติดต่อ">
      </div>

      <!-- ขั้นตอนที่ 2: สถานะและคู่แข่ง -->
      <div class="form-section" id="step2">
        <h3>2. สถานะโครงการและคู่แข่ง</h3>
        
        <label for="projectStatus">สถานะโครงการ</label>
        <select id="projectStatus">
          <option value="">-- เลือกสถานะ --</option>
          <option value="ยังไม่เปิดขาย">ยังไม่เปิดขาย</option>
          <option value="เปิด Pre-sale">เปิด Pre-sale</option>
          <option value="พร้อมขาย">พร้อมขาย</option>
          <option value="Ready to Move">Ready to Move</option>    
        </select>
        
        <label for="saleStatus">สถานะการขาย (เป้าโอนโครงการ / ขายแล้ว / คงเหลือ)</label>
        <div class="input-wrapper">
          <textarea id="saleStatus" placeholder="เช่น เป้าโอนเดือนละเท่าไหร่, ขายแล้ว 80%, โอน 50%, คงเหลือ เท่าไหร่"></textarea>
          <button type="button" class="btn-mic" onclick="startDictation('saleStatus', this)" title="พิมพ์ด้วยเสียง">🎙️</button>
        </div>

        <label for="competitorPromotion">โปรโมชั่นคู่แข่ง / ข้อมูลตลาด</label>
        <div class="input-wrapper">
          <textarea id="competitorPromotion" placeholder="ระบุโปรโมชั่นคู่แข่ง หรือข้อมูลตลาด..."></textarea>
          <button type="button" class="btn-mic" onclick="startDictation('competitorPromotion', this)" title="พิมพ์ด้วยเสียง">🎙️</button>
        </div>
      </div>

      <!-- ขั้นตอนที่ 3: ประเด็นสำคัญ -->
      <div class="form-section" id="step3">
        <h3>3. ประเด็นสำคัญและการติดตาม</h3>
        
        <label for="summary">ประเด็นสำคัญจากการเข้าพบ</label>
        <div class="input-wrapper">
          <textarea id="summary" placeholder="สรุปสาระสำคัญสั้นๆ"></textarea>
          <button type="button" class="btn-mic" onclick="startDictation('summary', this)" title="พิมพ์ด้วยเสียง">🎙️</button>
        </div>
        
        <label for="actionItems">สิ่งที่ต้องดำเนินการ (Action Items)</label>
        <div class="input-wrapper">
          <textarea id="actionItems" placeholder="งานที่ต้องทำต่อ"></textarea>
          <button type="button" class="btn-mic" onclick="startDictation('actionItems', this)" title="พิมพ์ด้วยเสียง">🎙️</button>
        </div>
        
        <label for="nextFollowUpDate">วันติดตามครั้งถัดไป (ระบบตั้งค่าให้อัตโนมัติ +7 วัน)</label>
        <input id="nextFollowUpDate" type="date">
      </div>

      <!-- ขั้นตอนที่ 4: รูปถ่ายและไฟล์แนบ -->
      <div class="form-section" id="step4">
        <h3>4. รูปถ่ายและไฟล์แนบ</h3>
        
        <button type="button" id="btnCamera" onclick="document.getElementById('cameraUpload').click()" class="btn-secondary">
          📷 เปิดกล้องถ่ายรูปหน้างาน
        </button>
        <input id="cameraUpload" type="file" accept="image/*" style="display: none;">
        
        <label style="margin-top: 15px;">แนบไฟล์เอกสาร/รูปภาพเพิ่มเติม</label>
        <input id="fileUpload" type="file" accept="image/*, .pdf, .xlsx, .docx" multiple>
        
        <div id="previewContainer" class="preview-container"></div>
      </div>
      
      <!-- ปุ่มควบคุม -->
      <div class="button-group step-buttons">
        <button type="button" id="btnPrev" class="btn-clear" onclick="changeStep(-1)" style="display:none;">ย้อนกลับ</button>
        <button type="button" id="btnNext" class="btn-primary" onclick="changeStep(1)">ถัดไป</button>
        <button type="button" id="btnSave" class="btn-success" onclick="saveData()" style="display:none;">บันทึกและส่งข้อมูล</button>
      </div>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
      <a href="#" onclick="clearFormAndDraft(); return false;" style="color: #a0aec0; font-size: 12px; text-decoration: none;">🔄 เริ่มใหม่ / ล้างข้อมูลที่ร่างไว้</a>
    </div>
  </div>
  
  <script src="script.js?v=6.0"></script>
</body>
</html>

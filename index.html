<form id='visitForm'>
      
      <!-- ขั้นตอนที่ 1: ข้อมูลหลัก -->
      <div class='form-section active' id='step1'>
        <h3>1. ข้อมูลหลักโครงการ</h3>
        <label>Developer *</label>
        <input id='developer' type='text' list='developerList' placeholder='พิมพ์ค้นหา หรือ เลือก...' required>
        <datalist id='developerList'></datalist>
        
        <label>โครงการ *</label>
        <input id='project' type='text' list='projectList' placeholder='รอเลือก Developer...' required disabled>
        <datalist id='projectList'></datalist>
        
        <!-- แก้ไข: เอา * และ required ออก -->
        <label>ผู้ติดต่อ (เจ้าหน้าที่โครงการ)</label>
        <input id='contact' type='text' placeholder='กรอกชื่อผู้ติดต่อ (ถ้ามี)'>
      </div>

      <!-- ขั้นตอนที่ 2: สถานะและคู่แข่ง -->
      <div class='form-section' id='step2'>
        <h3>2. สถานะโครงการและคู่แข่ง</h3>
        <label>สถานะโครงการ</label>
        <select id='projectStatus'>
          <option value=''>-- เลือกสถานะ --</option>
          <option value='ยังไม่เปิดขาย'>ยังไม่เปิดขาย</option>
          <option value='เปิด Pre-sale'>เปิด Pre-sale</option>
          <option value='พร้อมขาย'>พร้อมขาย</option>
        </select>
        
        <label>สถานะการขาย (ขาย / โอน / คงเหลือ)</label>
        <div class="input-wrapper">
          <textarea id='saleStatus' placeholder='เช่น ขายแล้ว 80%, โอน 50%'></textarea>
          <!-- แก้ไข: เพิ่ม this เข้าไปในฟังก์ชัน -->
          <button type="button" class="btn-mic" onclick="startDictation('saleStatus', this)" title="พิมพ์ด้วยเสียง">🎙️</button>
        </div>

        <label>โปรโมชั่นคู่แข่ง / ข้อมูลตลาด</label>
        <div class="input-wrapper">
          <textarea id='competitorPromotion' placeholder='ระบุโปรโมชั่นคู่แข่ง หรือข้อมูลตลาด...'></textarea>
          <!-- แก้ไข: เพิ่ม this เข้าไปในฟังก์ชัน -->
          <button type="button" class="btn-mic" onclick="startDictation('competitorPromotion', this)">🎙️</button>
        </div>
      </div>

      <!-- ขั้นตอนที่ 3: ประเด็นสำคัญ -->
      <div class='form-section' id='step3'>
        <h3>3. ประเด็นสำคัญและการติดตาม</h3>
        <label>ประเด็นสำคัญจากการเข้าพบ</label>
        <div class="input-wrapper">
          <textarea id='summary' placeholder='สรุปสาระสำคัญสั้นๆ'></textarea>
          <!-- แก้ไข: เพิ่ม this เข้าไปในฟังก์ชัน -->
          <button type="button" class="btn-mic" onclick="startDictation('summary', this)">🎙️</button>
        </div>
        
        <label>สิ่งที่ต้องดำเนินการ (Action Items)</label>
        <div class="input-wrapper">
          <textarea id='actionItems' placeholder='งานที่ต้องทำต่อ'></textarea>
          <!-- แก้ไข: เพิ่ม this เข้าไปในฟังก์ชัน -->
          <button type="button" class="btn-mic" onclick="startDictation('actionItems', this)">🎙️</button>
        </div>
        
        <label>วันติดตามครั้งถัดไป</label>
        <input id='nextFollowUpDate' type='date'>
      </div>

      <!-- ขั้นตอนที่ 4: รูปถ่ายและไฟล์แนบ -->
      <!-- (ส่วนนี้เหมือนเดิม) -->
      <div class='form-section' id='step4'>
        <h3>4. รูปถ่ายและไฟล์แนบ</h3>
        <button type='button' id='btnCamera' onclick='document.getElementById("cameraUpload").click()' class='btn-secondary'>
          📷 เปิดกล้องถ่ายรูปหน้างาน
        </button>
        <input id='cameraUpload' type='file' accept='image/*' capture='environment' multiple style='display: none;'>
        
        <label style='margin-top: 10px;'>แนบไฟล์เอกสารเพิ่มเติม</label>
        <input id='fileUpload' type='file' accept='image/*, .pdf, .xlsx' multiple>
        
        <div id='previewContainer' class='preview-container'></div>
      </div>
      
      <!-- ปุ่มควบคุมทิศทาง -->
      <div class='button-group step-buttons'>
        <button type='button' id='btnPrev' class='btn-clear' onclick='changeStep(-1)' style='display:none;'>ย้อนกลับ</button>
        <button type='button' id='btnNext' class='btn-primary' onclick='changeStep(1)'>ถัดไป</button>
        <button type='button' id='btnSave' class='btn-success' onclick='saveData()' style='display:none;'>บันทึกข้อมูล</button>
      </div>
    </form>
